<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="630" fill="#0f0f23"/>
  <!-- Grid -->
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <!-- Glow -->
  <radialGradient id="glow" cx="50%" cy="40%" r="50%">
    <stop offset="0%" stop-color="#6366f1" stop-opacity="0.25"/>
    <stop offset="100%" stop-color="#0f0f23" stop-opacity="0"/>
  </radialGradient>
  <rect width="1200" height="630" fill="url(#glow)"/>
  <!-- Logo mark -->
  <rect x="80" y="80" width="52" height="52" rx="14" fill="#6366f1"/>
  <path d="M93 106h26M106 93l13 13-13 13" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Wordmark -->
  <text x="148" y="116" font-family="system-ui,-apple-system,sans-serif" font-size="28" font-weight="700" fill="white" letter-spacing="-0.5">Sortify</text>
  <!-- Headline -->
  <text x="80" y="260" font-family="system-ui,-apple-system,sans-serif" font-size="68" font-weight="800" fill="white" letter-spacing="-2">Stop chasing clients</text>
  <text x="80" y="340" font-family="system-ui,-apple-system,sans-serif" font-size="68" font-weight="800" letter-spacing="-2">
    <tspan fill="#818cf8">for documents.</tspan>
  </text>
  <!-- Subline -->
  <text x="80" y="420" font-family="system-ui,-apple-system,sans-serif" font-size="28" fill="rgba(255,255,255,0.55)" letter-spacing="-0.3">Send one link. Your client uploads everything.</text>
  <!-- Pill badge -->
  <rect x="80" y="468" width="320" height="44" rx="22" fill="rgba(99,102,241,0.2)" stroke="#6366f1" stroke-width="1.5"/>
  <text x="240" y="496" font-family="system-ui,-apple-system,sans-serif" font-size="18" font-weight="600" fill="#a5b4fc" text-anchor="middle">From $14/mo · 14-day free trial</text>
</svg>
